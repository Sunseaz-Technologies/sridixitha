{% extends "base.html" %}
{% load static %}
{% block content %}

<style>

.edit-page{
    padding:24px;
    background:#f8fafc;
    min-height:100vh;
}

.edit-card{
    width:100%;
    max-width:760px;
    margin:auto;
    background:#ffffff;
    border:1px solid #edf1f5;
    border-radius:18px;
    overflow:hidden;
}

.edit-header{
    padding:24px;
    border-bottom:1px solid #eef2f7;
}

.edit-header h2{
    font-size:24px !important;
    color:#111827;
    font-weight:600;
    margin-bottom:6px;
}

.edit-header p{
    font-size:14px;
    color:#6b7280;
    font-weight:400;
}

.edit-body{
    padding:24px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:8px;
    font-size:13px;
    font-weight:500;
    color:#4b5563;
}

.form-input{
    width:100%;
    height:50px;
    border:1px solid #dbe1e8;
    border-radius:12px;
    padding:0 14px;
    font-size:14px;
    font-weight:400;
    color:#111827;
    background:#f9fafb;
    outline:none;
    transition:.2s ease;
}

.form-input.editable{
    background:#ffffff;
}

.form-input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.form-actions{
    margin-top:28px;
    display:flex;
    align-items:center;
    gap:14px;
}

.save-btn{
    height:48px;
    padding:0 22px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#ffffff;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:.2s ease;
}

.save-btn:hover{
    background:#1d4ed8;
}

.back-btn{
    height:48px;
    padding:0 22px;
    border-radius:12px;
    border:1px solid #dbe1e8;
    background:#ffffff;
    color:#374151;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:500;
    transition:.2s ease;
}

.back-btn:hover{
    background:#f9fafb;
}

@media(max-width:768px){

    .edit-page{
        padding:14px;
    }

    .edit-body{
        padding:18px;
    }

    .edit-header{
        padding:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:16px;
    }

    .form-actions{
        flex-direction:column;
    }

    .save-btn,
    .back-btn{
        width:100%;
    }
}
</style>

<div class="edit-page">

    <div class="edit-card">

        <div class="edit-header">

            <h2>
                Edit Admin
            </h2>

            <p>
                Update admin city and pincode
            </p>

        </div>

        <div class="edit-body">

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            First Name
                        </label>

                        <input
                            type="text"
                            value="{{ admin.first_name }}"
                            class="form-input"
                            readonly
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            Last Name
                        </label>

                        <input
                            type="text"
                            value="{{ admin.last_name }}"
                            class="form-input"
                            readonly
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="text"
                            value="{{ admin.email }}"
                            class="form-input"
                            readonly
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            value="{{ admin.phone }}"
                            class="form-input"
                            readonly
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            City
                        </label>

                        <input
                            type="text"
                            name="city"
                            value="{{ admin.city }}"
                            class="form-input editable"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            Pincode
                        </label>

                        <input
                            type="text"
                            name="pincode"
                            value="{{ admin.pincode }}"
                            class="form-input editable"
                        >

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="save-btn"
                    >

                        Save Changes

                    </button>

                    <a
                        href="{% url 'create_admin' %}"
                        class="back-btn"
                    >

                        Back

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
